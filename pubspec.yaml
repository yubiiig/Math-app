name: math_classroom
description: "로그인 없는 초등 수학 실시간 학급 관리 및 자동 채점 앱"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  firebase_core: ^3.3.0
  cloud_firestore: ^5.2.0
  firebase_messaging: ^15.0.4

  flutter_secure_storage: ^9.2.2
  uuid: ^4.4.0

  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.1

  pdf: ^3.10.8
  printing: ^5.13.0

  provider: ^6.1.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
